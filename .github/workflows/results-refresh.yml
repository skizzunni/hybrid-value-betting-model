name: Evening results refresh (ET)

# Results only: grades games and legs that finished since the morning run and refreshes analytics and
# data/status.json. It never runs the pick generator and never alters already-published picks or
# src/generated/picks.json. Fires 23:20-04:20 UTC; the ET guard allows ET hours 18-23, once per ET day.
on:
  schedule:
    - cron: '20 23,0,1,2,3,4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip the ET window guard'
        type: boolean
        default: false

concurrency:
  group: data-writes
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ET window guard
        id: guard
        run: node scripts/et-guard.mjs results ${{ inputs.force && '--force' || '' }}

      - name: Resolve outcomes and refresh analytics
        if: steps.guard.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/resolve-results.mjs --evening

      - name: Commit data
        if: always() && steps.guard.outputs.run == 'true'
        run: bash scripts/commit-data.sh "Auto-update results" data

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Daily pipeline failure'
            const body = `Results refresh ${context.runId} failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nSee \`data/status.json\` for details.`
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'pipeline-failure' })
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['pipeline-failure'] })
            }

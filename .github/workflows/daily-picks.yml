name: Daily outcomes + picks (ET)

# Window: midnight-8 AM America/New_York. GitHub cron is UTC-only and cannot follow DST, so this fires
# hourly from 04:17 to 13:17 UTC (covers 00:00-08:00 ET in both EDT and EST). The ET guard
# (scripts/et-guard.mjs) lets a run proceed only when the real ET hour is 0-7 and picks have not already
# been published successfully for that ET date. A failed attempt is retried by the next trigger.
on:
  schedule:
    - cron: '17 4-13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip the ET window guard'
        type: boolean
        default: false

concurrency:
  group: picks-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ET window guard
        id: guard
        run: node scripts/et-guard.mjs picks ${{ inputs.force && '--force' || '' }}

      - name: 1. Resolve outcomes and refresh analytics
        if: steps.guard.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/resolve-results.mjs

      - name: 2. Track today's slate (every game)
        if: steps.guard.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/track-games.mjs

      - name: 2b. Grade pending picks (pick log, closing lines, report)
        id: grade
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/grade-picks.mjs

      - name: 3. Generate picks (25 legs, learning-weighted)
        if: steps.guard.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/generate-picks.mjs ${{ inputs.force && '--force' || '' }}

      - name: 4. Link picks to games and check 25-leg slate
        if: steps.guard.outputs.run == 'true'
        run: node scripts/link-picks.mjs

      - name: Commit data
        if: always() && steps.guard.outputs.run == 'true'
        run: bash scripts/commit-data.sh "Auto-update picks and outcomes" src/generated/picks.json data

      - name: Fail loudly if pick grading failed
        if: steps.grade.outcome == 'failure'
        run: |
          echo "::error::scripts/grade-picks.mjs failed (see data/report.json and logs)"
          exit 1

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Daily pipeline failure'
            const body = `Run ${context.runId} failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nSee \`data/tracking-status.json\` (and \`data/status.json\` for the pick run) for details.`
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'pipeline-failure' })
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['pipeline-failure'] })
            }

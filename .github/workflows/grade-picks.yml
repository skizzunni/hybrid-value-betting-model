name: Grade picks and capture closing lines

on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:

concurrency:
  group: picks-data
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Grade pending picks
        id: grade
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/grade-picks.mjs

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Auto-update results"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail loudly if grading failed
        if: steps.grade.outcome == 'failure'
        run: exit 1
